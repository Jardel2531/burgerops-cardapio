<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cardápio Digital — BurgerOps</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;--bg4:#222;
  --gold:#f5a623;--gold2:#ffe08a;--red:#e63946;--green:#2dc653;
  --blue:#3a86ff;--cyan:#00b4d8;--border:#242424;
  --text:#f0f0f0;--text2:#777;--r:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s;}
#loading.hide{opacity:0;pointer-events:none;}
.ld-logo{font-family:'Bebas Neue';font-size:48px;color:var(--gold);letter-spacing:3px;text-shadow:0 0 40px rgba(245,166,35,.35);animation:bob 2s ease-in-out infinite;}
.ld-sub{font-size:11px;color:var(--text2);letter-spacing:3px;text-transform:uppercase;}
.ld-bar{width:160px;height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;}
.ld-fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:2px;animation:fill 1.3s ease forwards;}
@keyframes fill{to{width:100%;}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* HERO */
.hero{position:relative;background:var(--bg2);border-bottom:1px solid var(--border);padding:20px 16px 0;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(245,166,35,.05) 1px,transparent 1px);background-size:26px 26px;pointer-events:none;}
.hero::after{content:'';position:absolute;top:-100px;right:-100px;width:350px;height:350px;border-radius:50%;background:radial-gradient(circle,rgba(245,166,35,.07) 0%,transparent 65%);pointer-events:none;}
.hero-inner{position:relative;z-index:1;max-width:860px;margin:0 auto;}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-icon{font-size:34px;animation:bob 3s ease-in-out infinite;}
.brand-name{font-family:'Bebas Neue';font-size:26px;color:var(--gold);letter-spacing:2px;line-height:1;}
.brand-sub{font-size:10px;color:var(--text2);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
.status-pill{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:6px 14px;}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.status-txt{font-size:12px;font-weight:700;color:var(--green);}
.search-wrap{position:relative;margin-bottom:0;}
.search-input{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'Nunito';font-size:14px;font-weight:600;border-radius:10px;padding:11px 14px 11px 42px;outline:none;transition:border-color .2s,box-shadow .2s;}
.search-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,166,35,.1);}
.search-input::placeholder{color:var(--text2);}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:17px;pointer-events:none;}
.cats-nav{display:flex;gap:7px;overflow-x:auto;padding:14px 0;scrollbar-width:none;}
.cats-nav::-webkit-scrollbar{display:none;}
.cat-btn{flex-shrink:0;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-family:'Nunito';font-size:11px;font-weight:800;padding:6px 14px;border-radius:20px;cursor:pointer;transition:all .2s;white-space:nowrap;text-transform:uppercase;letter-spacing:.5px;}
.cat-btn:hover{border-color:var(--gold);color:var(--gold);}
.cat-btn.active{background:var(--gold);border-color:var(--gold);color:#000;}

/* MAIN */
.main{max-width:860px;margin:0 auto;padding:22px 14px 130px;}
.sec-title{font-family:'Bebas Neue';font-size:21px;letter-spacing:1px;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border);}
.sec-wrap{margin-bottom:28px;}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}

/* CARD */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;position:relative;}
.card:hover{transform:translateY(-3px);border-color:rgba(245,166,35,.35);box-shadow:0 10px 30px rgba(0,0,0,.5);}
.card.unavail{opacity:.4;pointer-events:none;}
.card-img{width:100%;height:150px;object-fit:cover;display:block;}
.card-placeholder{width:100%;height:150px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:48px;border-bottom:1px solid var(--border);}
.badge-unavail{position:absolute;top:10px;right:10px;background:rgba(230,57,70,.9);color:#fff;font-size:9px;font-weight:900;padding:3px 9px;border-radius:10px;text-transform:uppercase;letter-spacing:.5px;}
.card-body{padding:13px;}
.card-cat{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-bottom:3px;}
.card-name{font-weight:900;font-size:14px;line-height:1.3;margin-bottom:5px;}
.card-desc{font-size:11.5px;color:var(--text2);line-height:1.5;margin-bottom:11px;min-height:34px;}
.card-foot{display:flex;align-items:center;justify-content:space-between;}
.card-price{font-family:'Bebas Neue';font-size:21px;color:var(--gold);letter-spacing:.5px;}
.add-btn{background:var(--gold);color:#000;border:none;border-radius:8px;width:32px;height:32px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:900;transition:all .15s;flex-shrink:0;line-height:1;}
.add-btn:hover{background:var(--gold2);transform:scale(1.1);}
.add-btn:active{transform:scale(.93);}

/* EMPTY */
.empty{text-align:center;padding:50px 20px;color:var(--text2);}
.empty-icon{font-size:44px;margin-bottom:10px;}
.empty-txt{font-size:14px;font-weight:700;}

/* FAB */
.fab{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--gold);color:#000;border:none;border-radius:50px;padding:13px 26px;font-family:'Nunito';font-size:13px;font-weight:900;cursor:pointer;display:none;align-items:center;gap:9px;box-shadow:0 6px 28px rgba(245,166,35,.45);z-index:500;transition:transform .2s,box-shadow .2s;white-space:nowrap;}
.fab:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 10px 36px rgba(245,166,35,.55);}
.fab.show{display:flex;animation:fabUp .25s ease;}
@keyframes fabUp{from{opacity:0;transform:translateX(-50%) translateY(18px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.fab-badge{background:#000;color:var(--gold);border-radius:50%;width:21px;height:21px;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0;}

/* OVERLAY */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:800;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(5px);}
.ov.open{opacity:1;pointer-events:all;}

/* PANEL BASE */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:540px;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);}
.ov.open .panel{transform:none;}
.ph{position:sticky;top:0;background:var(--bg2);z-index:2;display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--border);}
.ph-title{font-family:'Bebas Neue';font-size:21px;color:var(--gold);letter-spacing:1px;}
.x-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.x-btn:hover{border-color:var(--red);color:var(--red);}

/* CART */
.cart-body{padding:14px 18px;}
.ci{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border);}
.ci:last-child{border-bottom:none;}
.ci-img{width:42px;height:42px;border-radius:8px;object-fit:cover;flex-shrink:0;}
.ci-emoji{font-size:26px;width:38px;text-align:center;flex-shrink:0;}
.ci-info{flex:1;}
.ci-name{font-weight:800;font-size:13px;line-height:1.2;}
.ci-uprice{font-size:11px;color:var(--text2);font-weight:600;margin-top:2px;}
.ci-qty{display:flex;align-items:center;gap:7px;}
.qb{background:var(--bg3);border:1px solid var(--border);color:var(--text);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;font-weight:900;transition:all .15s;}
.qb:hover{border-color:var(--gold);color:var(--gold);}
.qv{font-weight:900;font-size:13px;min-width:18px;text-align:center;}
.ci-tot{font-family:'Bebas Neue';font-size:17px;color:var(--green);min-width:54px;text-align:right;}
.cart-empty{text-align:center;padding:36px 20px;color:var(--text2);}

/* FORM */
.oform{padding:14px 18px 6px;border-top:1px solid var(--border);}
.total-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border-radius:10px;padding:13px 16px;margin-bottom:14px;}
.total-lbl{font-size:12px;color:var(--text2);font-weight:700;}
.total-val{font-family:'Bebas Neue';font-size:24px;color:var(--green);}
.lbl{font-size:11px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.7px;display:block;margin-bottom:5px;}
.inp{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'Nunito';font-size:13px;font-weight:600;border-radius:9px;padding:10px 13px;outline:none;margin-bottom:11px;transition:border-color .2s;}
.inp:focus{border-color:var(--gold);}
.inp::placeholder{color:var(--text2);}
select.inp{cursor:pointer;}
.wpp-btn{width:100%;background:#25D366;color:#fff;border:none;border-radius:11px;padding:15px;font-family:'Nunito';font-size:14px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:all .2s;margin-bottom:6px;}
.wpp-btn:hover{background:#1ebe5d;transform:translateY(-1px);box-shadow:0 6px 22px rgba(37,211,102,.3);}
.wpp-icon{width:19px;height:19px;fill:#fff;flex-shrink:0;}

/* PROD MODAL */
.prod-panel{background:var(--bg2);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:540px;max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);}
.ov.open .prod-panel{transform:none;}
.pm-img{width:100%;height:210px;object-fit:cover;display:block;}
.pm-placeholder{width:100%;height:180px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:64px;}
.pm-body{padding:18px 20px 22px;}
.pm-cat{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:3px;}
.pm-name{font-family:'Bebas Neue';font-size:26px;letter-spacing:1px;line-height:1.1;margin-bottom:8px;}
.pm-desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:14px;}
.pm-price{font-family:'Bebas Neue';font-size:30px;color:var(--gold);margin-bottom:18px;}
.pm-foot{display:flex;align-items:center;gap:12px;}
.pm-qty{display:flex;align-items:center;gap:9px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:8px 14px;}
.pm-add{flex:1;background:var(--gold);color:#000;border:none;border-radius:10px;padding:13px;font-family:'Nunito';font-size:14px;font-weight:900;cursor:pointer;transition:all .15s;}
.pm-add:hover{background:var(--gold2);}

/* TOAST */
#tc{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);z-index:9100;display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none;}
.ti{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:9px 18px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px;white-space:nowrap;animation:tiIn .22s ease;border-left:3px solid var(--gold);box-shadow:0 4px 18px rgba(0,0,0,.5);}
@keyframes tiIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* FOOTER */
.foot{text-align:center;padding:18px;font-size:11px;color:var(--text2);border-top:1px solid var(--border);}

/* CHECKOUT RESUMO */
.checkout-resumo{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
.checkout-titulo{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:10px;}
.checkout-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px;}
.checkout-item:last-child{border-bottom:none;}
.checkout-item-nome{font-weight:700;color:var(--text);}
.checkout-item-qty{font-size:11px;color:var(--text2);margin-left:6px;}
.checkout-item-preco{font-weight:800;color:var(--text);font-family:'Bebas Neue';font-size:16px;letter-spacing:.5px;}
.checkout-divider{border:none;border-top:1px solid var(--border);margin:10px 0;}
.checkout-linha{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px;}
.checkout-linha.total{margin-top:6px;padding-top:10px;border-top:2px solid var(--border);}
.checkout-linha.total .checkout-lbl{font-weight:900;font-size:14px;color:var(--text);}
.checkout-linha.total .checkout-vlr{font-family:'Bebas Neue';font-size:24px;color:var(--green);letter-spacing:.5px;}
.checkout-lbl{color:var(--text2);font-weight:700;}
.checkout-vlr{font-weight:800;color:var(--text);}
.checkout-vlr.gratis{color:var(--green);}
.checkout-info{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:14px;}
.checkout-info-row{display:flex;gap:8px;align-items:flex-start;font-size:12px;padding:3px 0;}
.checkout-info-lbl{color:var(--text2);font-weight:700;min-width:72px;}
.checkout-info-val{color:var(--text);font-weight:600;}

/* FRETE */
.frete-box{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:12px;}
.frete-row{display:flex;align-items:center;gap:8px;}
.frete-inp{flex:1;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-family:'Nunito';font-size:13px;font-weight:600;border-radius:8px;padding:9px 12px;outline:none;transition:border-color .2s;}
.frete-inp:focus{border-color:var(--gold);}
.frete-inp::placeholder{color:var(--text2);}
.frete-btn{background:var(--gold);color:#000;border:none;border-radius:8px;padding:9px 14px;font-family:'Nunito';font-size:12px;font-weight:900;cursor:pointer;white-space:nowrap;transition:all .15s;}
.frete-btn:hover{background:var(--gold2);}
.frete-result{margin-top:8px;font-size:12px;font-weight:700;display:none;}
.frete-result.ok{color:var(--green);}
.frete-result.err{color:var(--red);}
.frete-result.free{color:var(--gold);}

/* FADE */
.fi{animation:fi .35s ease both;}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--gold);}

@media(max-width:560px){
  .grid{grid-template-columns:1fr 1fr;}
  .card-img,.card-placeholder{height:120px;}
}
@media(max-width:360px){
  .grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="ld-logo">🍔 BurgerOps</div>
  <div class="ld-sub">Carregando cardápio...</div>
  <div class="ld-bar"><div class="ld-fill"></div></div>
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-inner">
    <div class="hero-top">
      <div class="brand">
        <span class="brand-icon">🍔</span>
        <div>
          <div class="brand-name" id="bname">BurgerOps</div>
          <div class="brand-sub" id="bsub">cardápio digital</div>
        </div>
      </div>
      <div class="status-pill">
        <div class="dot-live"></div>
        <span class="status-txt">Aberto</span>
      </div>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="srch" placeholder="Buscar no cardápio..." oninput="doSearch()">
    </div>
    <div class="cats-nav" id="cnav">
      <button class="cat-btn active" onclick="setCat('',this)">Todos</button>
    </div>
  </div>
</div>

<!-- MAIN -->
<main class="main" id="mc">
  <div class="empty"><div class="empty-icon">🍔</div><div class="empty-txt">Carregando...</div></div>
</main>

<div class="foot" id="foot">Powered by <strong style="color:var(--gold)">BurgerOps Pro</strong></div>

<!-- FAB -->
<button class="fab" id="fab" onclick="openCart()">
  <svg viewBox="0 0 24 24" width="17" height="17" fill="#000"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18M16 10a4 4 0 01-8 0"/></svg>
  <span id="fab-txt">Ver carrinho</span>
  <span class="fab-badge" id="fab-n">0</span>
</button>

<!-- OVERLAY CARRINHO -->
<div class="ov" id="ov-cart" onclick="bgClose(event,'ov-cart')">
  <div class="panel">
    <div class="ph">
      <div class="ph-title">🛒 Seu Pedido</div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="x-btn" onclick="esvaziarCart()" title="Esvaziar carrinho" style="font-size:13px">🗑️</button>
        <button class="x-btn" onclick="closeOv('ov-cart')">✕</button>
      </div>
    </div>
    <div class="cart-body" id="ci-list"></div>
    <div class="oform" id="oform">
      <div class="total-row">
        <span class="total-lbl">Subtotal</span>
        <span class="total-val" id="tot-val">R$ 0,00</span>
      </div>
      <div id="frete-breakdown" style="display:none;align-items:center;justify-content:space-between;padding:6px 16px;margin-bottom:8px;">
        <span style="font-size:12px;color:var(--text2);font-weight:700">🛵 Frete</span>
        <span style="font-size:13px;font-weight:800;color:var(--gold)" id="frete-val-display"></span>
      </div>

      <label class="lbl">Seu nome *</label>
      <input class="inp" id="fn" placeholder="João Silva" oninput="renderCheckout()">

      <label class="lbl">WhatsApp *</label>
      <input class="inp" id="ftel" type="tel" placeholder="(11) 99999-9999" oninput="renderCheckout()">

      <label class="lbl">Tipo de entrega *</label>
      <select class="inp" id="fentr" onchange="entrgChange(this.value);renderCheckout()">
        <option value="">Selecione...</option>
        <option value="Delivery">🛵 Delivery</option>
        <option value="Retirada no Balcão">🏠 Retirada no Balcão</option>
        <option value="Mesa (Local)">🪑 Mesa (Local)</option>
      </select>

      <div id="g-end" style="display:none">
        <label class="lbl">📍 Endereço *</label>
        <div class="frete-box">
          <input class="frete-inp" id="fend-rua" placeholder="Rua / Avenida..." style="margin-bottom:7px;width:100%">
          <div style="display:flex;gap:7px;margin-bottom:7px">
            <input class="frete-inp" id="fend-num" placeholder="Número" style="width:90px;flex-shrink:0">
            <input class="frete-inp" id="fend-bairro" placeholder="Bairro" style="flex:1">
          </div>
          <div class="frete-row">
            <input class="frete-inp" id="fend-cidade" placeholder="Cidade - UF" style="flex:1">
            <button class="frete-btn" onclick="calcularFrete()">📏 Calcular frete</button>
          </div>
          <div class="frete-result" id="frete-result"></div>
        </div>
      </div>
      <div id="g-mesa" style="display:none">
        <label class="lbl">🪑 Número da Mesa *</label>
        <input class="inp" id="fmesa" placeholder="Ex: Mesa 5">
      </div>

      <label class="lbl">Pagamento</label>
      <select class="inp" id="fpgto" onchange="renderCheckout()">
        <option value="">Selecione...</option>
        <option>PIX</option><option>Dinheiro</option>
        <option>Cartão de Crédito</option><option>Cartão de Débito</option>
      </select>

      <label class="lbl">Observações</label>
      <input class="inp" id="fobs" placeholder="Sem cebola, ponto da carne..." oninput="renderCheckout()">

      <!-- RESUMO DO CHECKOUT -->

<script>
'use strict';

// ── CONFIG ──────────────────────────────────────────────────
const MASTER_URL = 'https://hsqwchhwrikpbluhtwqk.supabase.co';
const MASTER_KEY = 'sb_publishable_8Q0er9mtHSWAPOXYYec87g_8IuDxPIj';

let CL_URL = '', CL_KEY = '', SLUG = '', EMPRESA = '', WPP = '';
let items = [], catAtiva = '', q = '', cart = [], mQty = 1, mItem = null;
let freteConfig = null, freteValor = 0;

// ── BOOT ────────────────────────────────────────────────────
function hideLoading() {
  const l = document.getElementById('loading');
  if (!l) return;
  l.classList.add('hide');
  setTimeout(() => l.remove(), 500);
}

async function boot() {
  const p = new URLSearchParams(location.search);
  SLUG = p.get('slug') || '';

  if (!SLUG) {
    erro('Informe o slug na URL: <br><code style="color:var(--gold)">?slug=seu-restaurante</code>');
    hideLoading();
    return;
  }

  const timeoutId = setTimeout(() => {
    erro('Tempo esgotado ao carregar o cardápio.<br>Verifique sua conexão e tente novamente.');
    hideLoading();
  }, 10000);

  try {
    const r = await fetch(
      `${MASTER_URL}/rest/v1/config_clientes?slug=eq.${encodeURIComponent(SLUG)}&select=*`,
      { headers:{ apikey: MASTER_KEY, Authorization: 'Bearer '+MASTER_KEY } }
    );
    if (!r.ok) throw new Error('Erro ao buscar configuração do restaurante (HTTP ' + r.status + ')');
    const rows = await r.json();
    if (!rows.length) {
      clearTimeout(timeoutId);
      erro('Restaurante "<strong>' + SLUG + '</strong>" não encontrado.<br>Verifique o slug na URL.');
      hideLoading();
      return;
    }

    const cfg = rows[0];
    CL_URL  = cfg.cliente_supabase_url.trim().replace(/\/$/,'');
    CL_KEY  = cfg.cliente_supabase_key.trim();
    EMPRESA = cfg.nome_empresa || 'Meu Restaurante';
    WPP     = (cfg.whatsapp || '').replace(/\D/g,'');

    // Carregar config de frete salva no localStorage do SaaS (se disponível no mesmo domínio)
    // Como cardápio e SaaS são domínios distintos, buscamos config de frete da tabela config_clientes
    try {
      const fc = cfg.frete ? JSON.parse(cfg.frete) : null;
      if (fc && fc.km) freteConfig = fc;
    } catch(e) {}
    document.getElementById('bname').textContent = EMPRESA;
    document.getElementById('bsub').textContent  = '@' + SLUG;
    document.title = `Cardápio — ${EMPRESA}`;
    document.getElementById('foot').innerHTML =
      `<strong style="color:var(--gold)">${EMPRESA}</strong> · Powered by BurgerOps Pro`;

    await loadMenu();
    clearTimeout(timeoutId);
  } catch(e) {
    clearTimeout(timeoutId);
    erro(e.message);
  }

  hideLoading();
}

async function loadMenu() {
  const r = await fetch(
    `${CL_URL}/rest/v1/cardapio?slug=eq.${encodeURIComponent(SLUG)}&order=categoria,nome`,
    { headers:{ apikey: CL_KEY, Authorization: 'Bearer '+CL_KEY } }
  );
  if (!r.ok) throw new Error(await r.text());
  items = await r.json();
  // Marcar itens do carrinho como indisponíveis se mudaram no SaaS
  cart = cart.filter(c => {
    const updated = items.find(i => i.id === c.i.id);
    if (updated) c.i = updated;
    return updated && updated.status === 'disponivel';
  });
  syncFab();

  // categorias
  const cats = [...new Set(items.map(i=>i.categoria).filter(Boolean))];
  const nav = document.getElementById('cnav');
  cats.forEach(c => {

    b.className = 'cat-btn';
    b.textContent = c;
    b.onclick = () => setCat(c, b);
    nav.appendChild(b);
  });
  render();
}

// ── RENDER ──────────────────────────────────────────────────
const CECAT = {Burgers:'🍔',Combos:'🍱',Acompanhamentos:'🍟',Bebidas:'🥤',Sobremesas:'🍦',Molhos:'🧴'};

function render() {
  const sq = q.toLowerCase();
  const f  = items.filter(i =>
    (!catAtiva || i.categoria === catAtiva) &&
    (!sq || i.nome.toLowerCase().includes(sq) || (i.descricao||'').toLowerCase().includes(sq))
  );

  const mc = document.getElementById('mc');
  if (!f.length) {
    mc.innerHTML = `<div class="empty fi"><div class="empty-icon">🔍</div><div class="empty-txt">Nenhum item encontrado</div></div>`;
    return;
  }

  const grp = {};
  f.forEach(i => { const c=i.categoria||'Outros'; if(!grp[c])grp[c]=[]; grp[c].push(i); });

  mc.innerHTML = Object.entries(grp).map(([cat,its]) => `
    <div class="sec-wrap fi">
      <div class="sec-title">${CECAT[cat]||'🍽️'} ${cat}</div>
      <div class="grid">${its.map(cardHTML).join('')}</div>

}

function cardHTML(i) {
  const u = i.status !== 'disponivel';
  const img = i.imagem_url
    ? `<img class="card-img" src="${i.imagem_url}" alt="${i.nome}" loading="lazy"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
       <div class="card-placeholder" style="display:none">${i.emoji||'🍔'}</div>`
    : `<div class="card-placeholder">${i.emoji||'🍔'}</div>`;

  return `<div class="card${u?' unavail':''}" onclick="openProd(${i.id})">
    ${img}
    ${u?`<div class="badge-unavail">Indisponível</div>`:''}

      <div class="card-cat">${i.categoria||''}</div>
      <div class="card-name">${i.nome}</div>

      <div class="card-foot">
        <div class="card-price">R$ ${Number(i.preco).toFixed(2)}</div>
        ${!u?`<button class="add-btn" onclick="event.stopPropagation();addCart(${i.id},1)">+</button>`:''}

}

function setCat(c, btn) {

function openProd(id) {

  mItem = i; mQty = 1;
  const img = i.imagem_url
    ? `<img class="pm-img" src="${i.imagem_url}" alt="${i.nome}">`

    <div class="ph">
      <div class="ph-title">Detalhes</div>

    </div>
    ${img}

      <div class="pm-cat">${i.categoria||''}</div>
      <div class="pm-name">${i.nome}</div>
      <div class="pm-desc">${i.descricao||'Sem descrição.'}</div>
      <div class="pm-price">R$ ${Number(i.preco).toFixed(2)}</div>
      <div class="pm-foot">
        <div class="pm-qty">
          <button class="qb" onclick="mq(-1)">−</button>

function mq(d) {
  mQty = Math.max(1,mQty+d);
  document.getElementById('mq-n').textContent = mQty;
  document.getElementById('mq-t').textContent = (Number(mItem.preco)*mQty).toFixed(2);
}
function addFromModal() { addCart(mItem.id, mQty); closeOv('ov-prod'); }

// ── CART ─────────────────────────────────────────────────────
function addCart(id, qty) {
  const i = items.find(x=>x.id===id); if(!i) return;
  const e = cart.find(c=>c.i.id===id);
  if(e) e.qty+=qty; else cart.push({i,qty});

}
function rmCart(id)  { cart=cart.filter(c=>c.i.id!==id); syncFab(); renderCart(); }
function cQty(id,d)  {
  const e=cart.find(c=>c.i.id===id); if(!e) return;
  e.qty+=d; if(e.qty<=0){rmCart(id);return;}
  syncFab(); renderCart();
}
function syncFab() {
  const subtotal = cart.reduce((s,c)=>s+c.i.preco*c.qty,0);
  const tot = subtotal + (freteValor > 0 ? freteValor : 0);
  const cnt = cart.reduce((s,c)=>s+c.qty,0);

  document.getElementById('fab-txt').textContent = `Ver carrinho · R$ ${tot.toFixed(2)}`;

}

function renderCart() {

function openCart() { renderCart(); openOv('ov-cart'); setTimeout(renderCheckout, 50); }

function renderCheckout() {

  if (nome || entr || pgto) {
    infoEl.style.display = 'block';

async function calcularFrete() {
  const rua    = document.getElementById('fend-rua').value.trim();
  const num    = document.getElementById('fend-num').value.trim();
  const bairro = document.getElementById('fend-bairro').value.trim();
  const cidade = document.getElementById('fend-cidade').value.trim();
  const end    = [rua, num, bairro, cidade].filter(Boolean).join(', ');
  const res = document.getElementById('frete-result');
  if (!rua || !cidade) { toast('⚠️ Preencha pelo menos rua e cidade!', true); return; }
  if (!freteConfig || !freteConfig.apikey) {
    // Sem config: mostrar aviso e deixar continuar sem frete
    res.className = 'frete-result err'; res.style.display = 'block';
    res.textContent = 'Frete não configurado. O valor será combinado na entrega.';
    freteValor = 0; atualizarTotalComFrete(); return;
  }
  res.className = 'frete-result'; res.style.display = 'block';
  res.textContent = '⏳ Calculando...';
  try {
    const origem  = encodeURIComponent(freteConfig.origem);
    const destino = encodeURIComponent(end + ', Brasil');
    const url = `https://maps.googleapis.com/maps/api/distancematrix/json?origins=${origem}&destinations=${destino}&mode=driving&language=pt-BR&key=${freteConfig.apikey}`;
    // Usar proxy CORS-anywhere ou backend — como não temos, usar endpoint via callback
    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
    const r = await fetch(proxyUrl);
    const data = await r.json();
    const el = data?.rows?.[0]?.elements?.[0];
    if (!el || el.status !== 'OK') throw new Error('Endereço não encontrado');
    const distKm = el.distance.value / 1000;
    const raio = freteConfig.raio || 999;
    if (distKm > raio) {
      res.className = 'frete-result err'; res.style.display = 'block';
      res.textContent = `❌ Fora da área de entrega (máx. ${raio}km). Distância: ${distKm.toFixed(1)}km`;
      freteValor = -1; return;
    }
    const tot = cart.reduce((s,c) => s + c.i.preco * c.qty, 0);
    const gratis = freteConfig.gratis || 0;
    if (gratis > 0 && tot >= gratis) {
      freteValor = 0;
      res.className = 'frete-result free'; res.style.display = 'block';
      res.textContent = `🎉 Frete GRÁTIS! Distância: ${distKm.toFixed(1)}km`;
    } else {
      freteValor = +(distKm * freteConfig.km).toFixed(2);
      res.className = 'frete-result ok'; res.style.display = 'block';
      res.textContent = `📍 ${distKm.toFixed(1)}km — Frete: R$ ${freteValor.toFixed(2)}`;
    }
    atualizarTotalComFrete();
    renderCheckout();
  } catch(e) {
    res.className = 'frete-result err'; res.style.display = 'block';
    res.textContent = 'Erro ao calcular frete. Verifique o endereço.';
    freteValor = 0;
  }
}

function atualizarTotalComFrete() {
  const tot = cart.reduce((s,c) => s + c.i.preco * c.qty, 0);
  const totalFinal = tot + (freteValor > 0 ? freteValor : 0);
  document.getElementById('tot-val').textContent = `R$ ${totalFinal.toFixed(2)}`;
  // Mostrar breakdown se há frete
  const row = document.getElementById('frete-breakdown');
  if (row) {
    if (freteValor > 0) {
      row.style.display = 'flex';
      document.getElementById('frete-val-display').textContent = `+ R$ ${freteValor.toFixed(2)}`;
    } else {
      row.style.display = 'none';
    }
  }
}
function esvaziarCart() {
  if (!cart.length) return;
  if (!confirm('Esvaziar o carrinho?')) return;
  cart = [];
  syncFab();
  renderCart();
  toast('🗑️ Carrinho esvaziado!');

async function sendOrder() {
  const nome  = document.getElementById('fn').value.trim();
  const tel   = document.getElementById('ftel').value.trim();
  const entr  = document.getElementById('fentr').value;
  const rua_    = (document.getElementById('fend-rua')?.value||'').trim();
  const num_    = (document.getElementById('fend-num')?.value||'').trim();
  const bairro_ = (document.getElementById('fend-bairro')?.value||'').trim();
  const cidade_ = (document.getElementById('fend-cidade')?.value||'').trim();
  const end     = [rua_, num_, bairro_, cidade_].filter(Boolean).join(', ');
  const mesa  = document.getElementById('fmesa').value.trim();
  const pgto  = document.getElementById('fpgto').value;
  const obs   = document.getElementById('fobs').value.trim();

  if (!nome)  { toast('⚠️ Informe seu nome!',true); return; }
  if (!entr)  { toast('⚠️ Escolha o tipo de entrega!',true); return; }
  if (entr==='Delivery' && (!rua_ || !cidade_)) { toast('⚠️ Informe rua e cidade!',true); return; }
  if (entr==='Mesa (Local)' && !mesa)    { toast('⚠️ Informe a mesa!',true); return; }
  if (!cart.length) { toast('⚠️ Carrinho vazio!',true); return; }

  const subtotal = cart.reduce((s,c)=>s+c.i.preco*c.qty,0);
  const tot = subtotal + (freteValor > 0 ? freteValor : 0);

  // ── SALVAR NO SUPABASE DO CLIENTE ──────────────────────────
  const itensTexto = cart.map(c =>
    `${c.qty}x ${c.i.nome} — R$ ${(c.i.preco * c.qty).toFixed(2)}`
  ).join(', ');

  const pedido = {
    slug: SLUG,
    empresa: EMPRESA,
    cliente_nome: nome,
    telefone: tel || null,
    tipo_entrega: entr,
    endereco: entr==='Delivery' ? end : null,
    mesa: entr==='Mesa (Local)' ? mesa : null,
    pagamento: pgto || null,
    observacoes: obs || null,
    itens: itensTexto,
    subtotal: +subtotal.toFixed(2),
    frete: freteValor > 0 ? +freteValor.toFixed(2) : 0,
    total: +tot.toFixed(2),
    status: 'novo',
    criado_em: new Date().toISOString()
  };

  console.log('📦 Enviando pedido para Supabase...');
  console.log('URL:', CL_URL + '/rest/v1/pedidos');
  console.log('Payload:', JSON.stringify(pedido, null, 2));

  try {
    const r = await fetch(`${CL_URL}/rest/v1/pedidos`, {
      method: 'POST',
      headers: {
        apikey: CL_KEY,
        Authorization: 'Bearer ' + CL_KEY,
        'Content-Type': 'application/json',
        Prefer: 'return=representation'
      },
      body: JSON.stringify(pedido)
    });
    const respText = await r.text();
    console.log('Supabase status:', r.status, r.statusText);
    console.log('Supabase response:', respText);
    if (!r.ok) {
      toast('⚠️ Erro ao salvar pedido (HTTP ' + r.status + '). Veja o console (F12).', true);
    } else {
      console.log('✅ Pedido salvo com sucesso no Supabase!');
    }
  } catch(e) {
    console.error('❌ Supabase fetch error:', e);
    toast('⚠️ Erro de conexão com o sistema. Pedido enviado só pelo WhatsApp.', true);
  }

  // ── ENVIAR WHATSAPP ────────────────────────────────────────
  let msg = `🍔 *PEDIDO — ${EMPRESA}*\n`;
  msg += `━━━━━━━━━━━━━━\n`;
  msg += `👤 *Cliente:* ${nome}\n`;
  if (tel) msg += `📞 *Tel:* ${tel}\n`;
  msg += `🛵 *Entrega:* ${entr}\n`;
  if (entr==='Delivery')     msg += `📍 *Endereço:* ${end}\n`;
  if (entr==='Mesa (Local)') msg += `🪑 *Mesa:* ${mesa}\n`;
  if (pgto) msg += `💳 *Pagamento:* ${pgto}\n`;
  msg += `━━━━━━━━━━━━━━\n*ITENS:*\n`;
  cart.forEach(c => {
    msg += `  • ${c.qty}x ${c.i.nome} — R$ ${(c.i.preco*c.qty).toFixed(2)}\n`;
  });
  msg += `━━━━━━━━━━━━━━\n`;
  if (freteValor > 0) msg += `🛵 *Frete: R$ ${freteValor.toFixed(2)}*\n`;
  msg += `💰 *TOTAL: R$ ${tot.toFixed(2)}*\n`;
  if (obs) msg += `📝 *Obs:* ${obs}`;

  const dest = WPP ? '55'+WPP : '';
  window.open(`https://wa.me/${dest}?text=${encodeURIComponent(msg)}`, '_blank');

  cart = [];
  syncFab();
  closeOv('ov-cart');
  toast('✅ Pedido registrado e enviado pelo WhatsApp!');
  ['fn','ftel','fend-rua','fend-num','fend-bairro','fend-cidade','fmesa','fpgto','fobs'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  document.getElementById('fentr').value='';
  entrgChange('');
  freteValor = 0;
  const fr = document.getElementById('frete-result'); if(fr) { fr.style.display='none'; fr.textContent=''; }
  const fb = document.getElementById('frete-breakdown'); if(fb) fb.style.display='none';
}

// ── MODAL HELPERS ────────────────────────────────────────────
function openOv(id)  { document.getElementById(id).classList.add('open'); document.body.style.overflow='hidden'; }
function closeOv(id) { document.getElementById(id).classList.remove('open'); document.body.style.overflow=''; }
function bgClose(e,id) { if(e.target===document.getElementById(id)) closeOv(id); }

document.addEventListener('keydown', e => {
  if(e.key==='Escape') { closeOv('ov-cart'); closeOv('ov-prod'); }
});

// ── TOAST ────────────────────────────────────────────────────
function toast(msg, err=false) {
  const el = document.createElement('div');
  el.className = 'ti';
  el.style.borderLeftColor = err ? '#e63946' : '#f5a623';
  el.textContent = msg;
  document.getElementById('tc').appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

// ── ERRO ─────────────────────────────────────────────────────
function erro(msg) {
  document.getElementById('mc').innerHTML =
    `<div class="empty fi"><div class="empty-icon">⚠️</div><div class="empty-txt" style="color:var(--red)">${msg}</div></div>`;
  const l=document.getElementById('loading');
  l.classList.add('hide'); setTimeout(()=>l.remove(),500);
}

boot();
// Atualiza o menu a cada 60s para refletir mudanças de disponibilidade feitas no SaaS
setInterval(async () => {
  if (!CL_URL || !CL_KEY) return;
  try { await loadMenu(); render(); } catch(e) {}
}, 60000);
</script>
</body>
</html>
